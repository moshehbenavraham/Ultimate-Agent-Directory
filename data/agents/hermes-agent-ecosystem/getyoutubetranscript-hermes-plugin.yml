name: GetYouTubeTranscript for Hermes Agent
url: https://github.com/tubeagentkit/youtube-transcript-hermes-plugin
description: Hermes Agent plugin that connects the GetYouTubeTranscript remote MCP
  server for YouTube transcripts with optional timestamps, video search, and channel
  and playlist browsing. Ships four skills that tell the agent when to fetch, search
  or summarize; all tools are read-only and need an API key (100 credits on sign-up).
