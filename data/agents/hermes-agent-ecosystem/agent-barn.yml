description: Open-source (Apache-2.0) control plane for AI agents. Teams talk to agents in Slack, Teams, Telegram, Discord or email; agents work across Jira, GitHub, Confluence and more. Every conversation, tool call, log and cost is recorded. Runs agent runtimes like Hermes and OpenClaw on your own Kubernetes cluster, deployed with Helm.
