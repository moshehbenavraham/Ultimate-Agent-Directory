name: CurlShot
url: https://curlshot.com
description: Screenshot API with a remote MCP server that lets agents render a URL,
  HTML or Markdown in a real browser and get back an image, PDF or scrolling video.
  The MCP server exposes take_screenshot and list_devices tools, and the REST API
  adds async jobs with signed webhooks and bulk captures.
