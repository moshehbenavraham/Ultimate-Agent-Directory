name: OrcaReplay
url: https://github.com/Continuum-AI-Corp/OrcaReplay
description: Records a coding agent's exchange with its model provider at the HTTP boundary and replays the run offline with no model called, turning a failed session into a repeatable regression case. Replay can fork from any step onto a different model, keeping everything before the fork byte-identical so the model is the only variable.
