name: CloudGPU MCP
url: https://github.com/cloudgpu-app/cloudgpu-mcp
description: Open-source local (stdio) MCP server that lets an AI agent rent an RTX 4090/5090 GPU
  instance on CloudGPU, upload code and data, run a training or inference job, download
  the results and destroy the instance. The user approves the account connection and a
  spending limit first, and each instance carries server-side spend, time and idle
  limits. Works with any MCP client that can start a local server; the same key also
  covers CloudGPU's OpenAI-compatible API for open models.
